name: integration-tests
# Not every push. These stand up docker-compose services and are the slowest
# thing here, so they run where the answer changes something: a pull request,
# and whatever lands on `main`.
on:
  # Prose-only commits are skipped, as in `ci.yml`: nothing here reads these paths.
  pull_request:
    paths-ignore: &prose
      - 'context/**'
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore: *prose
# If you want to add integration tests for linux-based binary,
# please, use the following files:
# - tests/integration/Makefile
# - tests/integration/docker-compose.yml
# - tests/integration/scripts/*.sh

# One run per ref at a time, matching `ci.yml`. Both of these run tests, so the
# same rule applies: supersede a pull request pushed twice, but keep every
# result on `main` -- this repository develops by direct pushes to it, and a
# cancelled run leaves a commit with nothing to bisect against. Tags need no
# exception here, because the trigger above never fires on one.
#
# `main` gets a group per run rather than `cancel-in-progress: false` alone:
# that flag only spares the running run, and a newly queued run still cancels
# the pending one, so three quick pushes would lose the middle commit.
#
# `benchmarks.yml` deliberately differs: a superseded *measurement* is worth
# nothing, so it cancels on tags too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_BACKTRACE: full
  RUST_LOG: debug
  SCCACHE_PATH: /home/runner/.cargo/bin/sccion
  ACTIONS_CACHE_SERVICE_V2: on

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "stable"

      - name: Build
        run: |
          cargo build --all-features

      - uses: actions/upload-artifact@v7
        with:
          name: integration-tests
          path: ./target/debug/sccion

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        type: [backends, tools]

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Test
        run: cd tests/integration && WITH_COVERAGE=1 make test-${{ matrix.type }}

      - name: Build report
        run: |
          cd tests/integration
          WITH_COVERAGE=1 make coverage-report
          echo "Coverage files:"
          ls ../../target/integration-coverage/profraw -l
          echo "Coverage report:"
          ls ../../target/integration-coverage/reports/lcov.info -l

      # After the tests, and not a verdict on them -- as in `ci.yml`. A private
      # repository has no CODECOV_TOKEN, so this fails on every run and was the
      # only red step left in this workflow.
      - name: Upload coverage results (to Codecov.io)
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: target/integration-coverage/reports/lcov.info
          name: codecov-umbrella-integration-${{ matrix.type }}
          fail_ci_if_error: true
          # verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # This repository's GitHub Action (action.yml at the root), against the sccion
  # this workflow just built: its TypeScript type-checks, the Actions cache
  # credentials stay with the server, every write reaches the Actions cache, and
  # a clean rebuild reads every lookup back from it. A small crate rather than
  # sccion itself, so a run adds a few entries to the repository's cache, not
  # hundreds of megabytes.
  #
  # The write assertion is the one that matters most: a cache that stores
  # nothing passes every build, only slower. That is how ci.yml's own cache ran
  # for a whole run -- 794 misses, 794 failed writes -- before anyone looked.
  gha:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    env:
      # tests/test-crate reads it with env!(), and fails to compile without it.
      TEST_ENV_VAR: "1"
    defaults:
      run:
        working-directory: tests/test-crate

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      # The action runs as written, on the runner's Node 24, so this is the only
      # check its source gets before a runner executes it.
      - name: Type-check the action
        working-directory: .github/action
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "stable"

      - uses: actions/download-artifact@v8
        with:
          name: integration-tests
          path: /home/runner/.cargo/bin/
      - name: Chmod for binary
        working-directory: .
        run: chmod +x ${SCCACHE_PATH}

      - name: Set up sccion through the action
        id: sccion
        uses: ./
        with:
          binary: ${{ env.SCCACHE_PATH }}
          # No earlier run wrote here, so every hit below is this job's own write.
          gha-version: action-${{ github.run_id }}-${{ github.run_attempt }}
          required: true

      - name: The cache credentials stayed with the server
        run: |
          for v in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL SCCION_GHA_ENABLED SCCACHE_GHA_ENABLED; do
            if [ -n "${!v:-}" ]; then echo "::error::$v reached a run step"; exit 1; fi
          done
          [ "$RUSTC_WRAPPER" = '${{ steps.sccion.outputs.rustc-wrapper }}' ]
          [ "$(basename "$RUSTC_WRAPPER")" = sccache ]

      - name: Cold build; every write reaches the Actions cache
        run: |
          cargo build
          sccion --show-stats
          sccion --show-stats --stats-format=json | jq -e '.stats.cache_writes > 0 and .stats.cache_write_errors == 0'
          sccion --zero-stats

      - name: Clean build; every lookup a hit
        run: |
          cargo clean
          cargo build
          sccion --show-stats
          sccion --show-stats --stats-format=json \
            | jq -e '([.stats.cache_hits.counts[]] | add // 0) > 0 and ([.stats.cache_misses.counts[]] | add // 0) == 0'

  test-mock-msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TARGET: x86_64-pc-windows-msvc
      SCCACHE_EXE: ${{ github.workspace }}\\target\\x86_64-pc-windows-msvc\\debug\\sccion.exe
      SCCACHE_LOG: "debug"
      SCCACHE_ERROR_LOG: "${{ github.workspace }}\\server_log.txt"

    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "stable"
          target: $TARGET

      - name: Build
        run: cargo build --bin sccion --target $env:TARGET --features=vendored-openssl

      - name: Compile MSVC (no cache)
        shell: bash
        working-directory: ./tests/integration/msvc
        run: |
          cl "@args.rsp"
          test -e ./foo.o || { echo "No compiler output found"; exit -1; }

      # Preprocessor cache mode on by name, not by default. The disk cache does
      # default to it, but these steps exist to test that mode -- a hit there
      # runs no compiler, so nothing writes the caller's dependency file unless
      # sccion sees to it -- and a changed default must not quietly turn them
      # into tests of the other mode.
      - name: Start Server
        shell: bash
        env:
          SCCION_DIRECT: "true"
        run: $SCCACHE_EXE --start-server

      - name: Compile - Cache Miss
        shell: bash
        working-directory: ./tests/integration/msvc
        run: |
          rm ./foo.o || true
          $SCCACHE_EXE "$(where cl.exe)" -c "@args.rsp"
          $SCCACHE_EXE --show-stats
          $SCCACHE_EXE --show-stats | grep -e "Cache misses\s*[1-9]"
          test -e ./foo.o || { echo "No compiler output found"; exit -1; }
          test -e ./foo.o.json || { echo "No dependency list found"; exit -1; }

      # The dependency list is deleted along with the object. It used not to
      # be, so the check below found the miss's copy and could never fail --
      # which is how a hit that wrote no `foo.o.json` went unnoticed here while
      # `test_sccache_command::with_preprocessor_cache` failed on it.
      - name: Compile - Cache Hit
        shell: bash
        working-directory: ./tests/integration/msvc
        run: |
          rm ./foo.o ./foo.o.json || true
          $SCCACHE_EXE "$(where cl.exe)" -c "@args.rsp"
          $SCCACHE_EXE --show-stats
          $SCCACHE_EXE --show-stats | grep -e "Cache hits\s*[1-9]"
          test -e ./foo.o || { echo "No compiler output found"; exit -1; }
          test -e ./foo.o.json || { echo "No dependency list regenerated on the hit"; exit -1; }

      # The control for the step above: without a dependency file the mode is
      # really in play, and a second compile is a preprocessor cache hit. If
      # this stops hitting, the step above no longer tests what it says.
      - name: Compile - Preprocessor cache hit without a dependency file
        shell: bash
        working-directory: ./tests/integration/msvc
        run: |
          for i in 1 2; do
            rm ./direct.o || true
            $SCCACHE_EXE "$(where cl.exe)" -c foo.cpp -Fodirect.o
            test -e ./direct.o || { echo "No compiler output found"; exit -1; }
          done
          $SCCACHE_EXE --show-stats
          $SCCACHE_EXE --show-stats | grep -e "Preprocessor cache hits\s*[1-9]"

      - name: Compile - Preprocessing Compiler Bug
        shell: bash
        working-directory: ./tests/integration/msvc-preprocessing
        run: |
          $SCCACHE_EXE "$(where cl.exe)" -c "@args.rsp"
          $SCCACHE_EXE --show-stats

      - name: Prepare - MSBuild support
        shell: bash
        working-directory: ./tests/msvc-msbuild
        # Force stop server to drop compiler cache - need to test showInclude prefix detection
        run: |
          $SCCACHE_EXE --stop-server
          mkdir -p compiler
          cp $SCCACHE_EXE compiler/cl.exe

      - name: Compile - MSBuild support
        working-directory: ./tests/msvc-msbuild
        run: msbuild MsbuildCpp.vcxproj -property:Configuration=Release -property:Platform=x64 "-property:SolutionDir=${{ github.workspace }}/tests/msvc-msbuild/"

      - name: Stop Server
        if: success() || failure()
        shell: bash
        run: $SCCACHE_EXE --stop-server

      - name: Show Server Log
        if: success() || failure()
        shell: bash
        run: cat "$SCCACHE_ERROR_LOG"

  hip:
    # Probably wouldn't matter anyway since we run in a container, but staying
    # close to the version is better than not.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    container:
      image: rocm/dev-ubuntu-24.04:6.3

    env:
      # SCCACHE_GHA_ENABLED: "on"
      ROCM_PATH: "/opt/rocm"
      RANDOMIZE_READDIR_LOG: "/tmp/readdir.log"

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      # I don't want to break the cache during testing. Will turn on after I
      # make sure it's working.
      #
      # - name: Configure Cache Env
      #   uses: actions/github-script@v8
      #   with:
      #     script: |
      #       core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
      #       core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      # - name: Configure ROCm Env
      #   uses: actions/github-script@v8
      #   with:
      #     script: |
      #       core.exportVariable('ROCM_PATH', process.env.ROCM_PATH || '');

      - name: Install dependencies
        shell: bash
        run: |
          ## Install dependencies
          sudo apt-get update
          sudo apt-get install -y cmake curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "stable"

      - name: Build & setup librandomize_readdir
        run: |
          cargo build -p randomize_readdir

      - uses: actions/download-artifact@v8
        with:
          name: integration-tests
          path: /home/runner/.cargo/bin/
      - name: Chmod for binary
        run: chmod +x ${SCCACHE_PATH}

      # Ensure that HIPCC isn't already borken
      - name: Sanity Check
        run: |
          export LD_PRELOAD=$PWD/target/debug/librandomize_readdir.so
          hipcc -o vectoradd_hip --offload-arch=gfx900 tests/integration/cmake-hip/vectoradd_hip.cpp

      - name: Test
        run: |
          export LD_PRELOAD=$PWD/target/debug/librandomize_readdir.so
          rm "$RANDOMIZE_READDIR_LOG".*
          cmake -B build -S tests/integration/cmake-hip -DCMAKE_HIP_COMPILER_LAUNCHER=${SCCACHE_PATH} -DCMAKE_HIP_ARCHITECTURES=gfx900
          cmake --build build
          if ! grep -q bitcode "$RANDOMIZE_READDIR_LOG".*; then
            echo "amdgcn bitcode not accessed, is librandomize_readdir properly set up?"
            exit 1
          fi

      - name: Output
        run: |
          export LD_PRELOAD=$PWD/target/debug/librandomize_readdir.so
          ${SCCACHE_PATH} --show-stats

      - name: Test Twice for Cache Read
        run: |
          export LD_PRELOAD=$PWD/target/debug/librandomize_readdir.so
          rm "$RANDOMIZE_READDIR_LOG".*
          rm -rf build
          cmake -B build -S tests/integration/cmake-hip -DCMAKE_HIP_COMPILER_LAUNCHER=${SCCACHE_PATH} -DCMAKE_HIP_ARCHITECTURES=gfx900
          cmake --build build
          if ! grep -q bitcode "$RANDOMIZE_READDIR_LOG".*; then
            echo "amdgcn bitcode not accessed, is librandomize_readdir properly set up?"
            exit 1
          fi

      - name: Output
        run: |
          export LD_PRELOAD=$PWD/target/debug/librandomize_readdir.so
          ${SCCACHE_PATH} --show-stats
          ${SCCACHE_PATH} --show-stats | grep -e "Cache hits\s*[1-9]"

  xcode:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SCCACHE_PATH: target/debug/sccion
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "stable"

      - name: Build sccion
        run: |
          cargo build

      - name: Start server
        run: ${SCCACHE_PATH} --start-server

      - name: Test compile xcode
        working-directory: tests/integration/xcode
        run: |
          xcodebuild -version
          xcodebuild -xcconfig sccion.xcconfig

      - name: Output
        run: |
          ${SCCACHE_PATH} --show-stats

      - name: Test compile xcode cached
        working-directory: tests/integration/xcode
        run: |
          xcodebuild clean
          xcodebuild -xcconfig sccion.xcconfig

      - name: Output
        run: |
          ${SCCACHE_PATH} --show-stats
          ${SCCACHE_PATH} --show-stats | grep -e "Cache hits\s*[1-9]"
