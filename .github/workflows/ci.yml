name: ci
on:
  # A third of the commits on `main` touch only prose, and each one paid for a
  # full matrix. Nothing in the build reads these paths. Tag pushes are not
  # path-filtered, so a release still runs whatever the tag's commit touched.
  #
  # Nor does it read the GitHub Action (action.yml, .github/action/): nothing
  # here runs it from the working tree, and integration-tests' `gha` job is
  # what tests it.
  #
  # Every branch, but only version tags. Without the tag filter any tag at all
  # ran the full matrix and all eight release builds -- macOS at ten times a
  # Linux minute -- before `release` refused it; and tags now double as the
  # action's versions, so one that is not a release must not try to be one.
  # Dependabot's branches are left to `pull_request`: each of its updates is a
  # pull request, and running the push as well ran the whole matrix twice.
  push:
    branches: ['**', '!dependabot/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore: &prose
      - 'context/**'
      - 'docs/**'
      - '**.md'
      - 'action.yml'
      - '.github/action/**'
  pull_request:
    paths-ignore: *prose
  # Beta and nightly, and the CUDA 11.8 entry, once a week instead of on every
  # push: an upstream regression is just as visible on Monday, at a seventh of
  # the cost. See `test_occasional`.
  schedule:
    - cron: '17 4 * * 1'
  # So a run can be asked for without inventing a commit to carry it. This
  # repository had Actions disabled at the repository level for its whole
  # history -- every workflow reported `state=active` while nothing could run --
  # and there was no way to prove the fix without pushing something.
  workflow_dispatch:
    inputs:
      cuda:
        description: >-
          Install nvcc and run the CUDA tests. Off by default: the hosted
          runners have no usable CUDA toolchain, so these fail on every run and
          teach people to ignore a red tick. Runs the occasional toolchains
          too, since the CUDA 11.8 entry lives there.
        type: boolean
        default: false
      toolchains:
        description: Also test on beta and nightly, as the weekly run does.
        type: boolean
        default: false
      build:
        description: >-
          Build the release binaries for every target, as a tag does. Half the
          cost of a run, so off unless asked for.
        type: boolean
        default: false

# One run per ref at a time. Three workflows fire on every push here, so a
# branch pushed twice in a minute was paying for two full matrices and reading
# only the second.
#
# Superseding is only wanted where a later commit answers the same question.
# `main` is not that: this repository develops by direct pushes to it, so
# cancelling would leave commits with no result at all and nothing to bisect
# when one of them turns out to have broken something. A tag is emphatically not
# that -- the `release` job runs there, and a cancelled release is a tag with no
# artifacts. Both keep every run; branches cancel.
#
# Keeping every run takes more than `cancel-in-progress: false`, which only
# spares the run already going. A group holds one running and one pending run,
# and a newly queued run cancels the pending one whatever that flag says -- so
# three pushes to `main` inside one run's length lost the middle commit. `main`
# and tags therefore get a group per run and never contend at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: ${{ matrix.component }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
        component: [ clippy ]
        include:
          - component: rustfmt
            cargo_cmd: fmt -- --check
            os: ubuntu-latest
          - component: clippy
            cargo_cmd: clippy --locked --all-targets -- -D warnings -A unknown-lints -A clippy::type_complexity -A clippy::new-without-default
          # Linux also lints the dist server, which no default build compiles.
          # A later include may replace a value an earlier include added,
          # which is how this one replaces `cargo_cmd` above.
          - os: ubuntu-latest
            component: clippy
            cargo_cmd: clippy --locked --all-targets --features dist-server -- -D warnings -A unknown-lints -A clippy::type_complexity -A clippy::new-without-default
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: ${{ matrix.component }}
          # Oldest supported version, keep in sync with README.md
          toolchain: "1.91.0"

      - name: clippy version
        run: cargo clippy --version
        if: ${{ matrix.component == 'clippy' }}

      - name: Check
        run: cargo ${{ matrix.cargo_cmd }}

  check_features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        feature: [ azure, gcs, gha, memcached, redis, s3, webdav ]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check feature ${{ matrix.feature }}
        run: cargo check --no-default-features --features ${{ matrix.feature }}

  toml_format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check
        run: npx --yes @taplo/cli fmt --check



  test:
    # `extra_desc` names what the job is *for*, and for the CUDA entries that is
    # only true when the input is on. Without it they are plain toolchain jobs --
    # on Windows they are the only test jobs there are -- and a row reading
    # `cuda12.8` that installed no CUDA and ran no CUDA test is a lie the summary
    # tells at a glance. The artifact and Codecov names below keep the raw
    # `extra_desc`, where a stable key matters more than an accurate label.
    name: test ${{ matrix.os }} rust ${{ matrix.rustc || 'stable' }} ${{ (matrix.cuda == '' || inputs.cuda) && matrix.extra_desc || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 30
    # Every push and pull request: one job per thing that differs, and no
    # toolchain twice on one OS. Beta, nightly and CUDA 11.8 run weekly in
    # `test_occasional`, which shares this job's env and steps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            # Oldest supported version, keep in sync with README.md
            rustc: "1.91.0"
            extra_desc: dist-tests
            extra_args: --no-default-features --features=dist-tests test_dist_ -- --test-threads 1
          # The dist server's unit tests, `dist::http`'s among them, which
          # build only with `dist-server`.
          - os: ubuntu-22.04
            rustc: stable
            extra_desc: dist-server
            extra_args: --features=dist-server
          - os: ubuntu-22.04
            rustc: stable
          - os: ubuntu-22.04
            extra_desc: no-default-features
            extra_args: --no-default-features
            allow_failure: true
          - os: ubuntu-24.04
            cuda: "12.8"
            # Oldest supported version, keep in sync with README.md
            rustc: "1.91.0"
            extra_desc: cuda12.8
          # Apple Silicon only. The Intel runner cost ten times a Linux minute
          # for 8-13 minutes a push, and GitHub is retiring it; the x86_64
          # binary is still built, cross-compiled from Apple Silicon on tags.
          - os: macos-14
          - os: windows-2022
            cuda: "12.8"
            # Oldest supported version, keep in sync with README.md
            rustc: "1.91.0"
            extra_args: --no-fail-fast
            notest_cuda_compilers: clang++
            extra_desc: cuda12.8
    env: &test-env
      RUST_BACKTRACE: 1
      COVERAGE_REPORT_DIR: "target/debug"
      COVERAGE_REPORT_FILE: "target/debug/lcov.info"
      BINARY_DIR: "target/debug"
      GRCOV_IGNORE_OPTION: '--ignore build.rs --ignore "/*" --ignore "[a-zA-Z]:/*"'
      GRCOV_EXCLUDE_OPTION: '--excl-br-line "^\s*((debug_)?assert(_eq|_ne)?!|#\[derive\()"'
      NOTEST_CUDA_COMPILERS: ${{ matrix.notest_cuda_compilers || '' }}
      CARGO_PROFILE_DEV_DEBUG: '0' # save disk space
    steps: &test-steps
      - if: ${{ contains(matrix.os, 'windows') }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ matrix.rustc }}
          components: llvm-tools-preview

      - if: ${{ contains(matrix.os, 'ubuntu') }}
        name: Install gcc & clang for tests
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          # Conflicts with clang-cuda
          if dpkg -s gcc-14 >/dev/null 2>&1; then
            sudo apt remove -y gcc-14 g++-14
            sudo apt autoremove -y
          fi
          sudo apt install -y --no-install-recommends gcc clang
          echo 'gcc version:'
          gcc --version
          echo 'clang version:'
          clang --version

      # Without nvcc on PATH, `find_cuda_compilers` returns nothing and
      # `test_cuda_sccache_command` warns and skips -- so gating the install is
      # all it takes to make CUDA opt-in. The matrix entries stay: on Windows
      # they are the only test jobs there is, and dropping them would take every
      # Windows toolchain with them.
      - if: ${{ matrix.cuda != '' && inputs.cuda && (runner.os == 'Linux' || runner.os == 'Windows') }}
        name: Install nvcc
        uses: ./.github/actions/nvcc-toolchain
        with:
          cuda-version: ${{ matrix.cuda }}

      - name: "`grcov` ~ install"
        if: ${{ ! matrix.no_coverage }}
        shell: bash
        run: |
          GRCOV_VERSION="0.10.7"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGET="x86_64-pc-windows-msvc"
            EXT="zip"
          elif [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "ARM64" ]]; then
            TARGET="aarch64-apple-darwin"
            EXT="tar.bz2"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            TARGET="x86_64-apple-darwin"
            EXT="tar.bz2"
          else
            TARGET="x86_64-unknown-linux-musl"
            EXT="tar.bz2"
          fi
          URL="https://github.com/mozilla/grcov/releases/download/v${GRCOV_VERSION}/grcov-${TARGET}.${EXT}"
          curl -sL "$URL" -o "grcov.${EXT}"
          if [[ "$EXT" == "zip" ]]; then
            unzip -q "grcov.${EXT}" -d "$HOME/.cargo/bin/"
          else
            tar -xjf "grcov.${EXT}" -C "$HOME/.cargo/bin/"
          fi

      - name: Create config for testing
        if: ${{ ! matrix.no_coverage }}
        run: |
          mkdir -p .cargo
          echo '[env]
          LLVM_PROFILE_FILE = { value = "target/debug/coverage/default-%p-%8m.profraw", relative = true }' >> .cargo/config.toml

      # Gated on the input as well: without it there is no CUDA toolchain to
      # make room for, and this deletes several gigabytes of the runner image
      # to do it.
      - if: ${{ matrix.cuda != '' && inputs.cuda && runner.os == 'Linux' }}
        name: Free disk space for CUDA tests
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/share/swift /var/lib/apt/lists/*

      # Compilation through a compiler cache kept in the Actions cache, so a
      # push recompiles what it changed rather than all ~400 crates. The tests
      # themselves run with no wrapper and no SCCACHE_* in sight: they start
      # sccion servers of their own and read that namespace, and a cache
      # setting leaking into them would change what they test.
      #
      # Upstream sccache, pinned and checksum-verified, rather than sccion:
      # the cache must not break when the code under test does, and sccion has
      # no release to download yet. Port 4227, clear of the 4226 the tests use.
      #
      # The cache URL and runtime token are handed over under names nothing
      # reads except the step that starts the server -- not ACTIONS_*, which
      # the test run would otherwise carry under the names a GHA backend
      # looks for.
      - name: Expose the Actions cache to the compiler cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('CI_CACHE_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('CI_CACHE_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Failing here costs speed, not the build: the step shows red, and
      # without CI_SCCACHE the build below runs uncached. A binary whose
      # checksum is wrong is never run either way.
      - name: Start the compiler cache
        continue-on-error: true
        shell: bash
        env:
          ACTIONS_RESULTS_URL: ${{ env.CI_CACHE_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.CI_CACHE_RUNTIME_TOKEN }}
          # Upstream sccache talks to the current cache service only when told
          # to; without this it uses the retired v1 API and every write fails.
          # Run 39325360573: 794 misses, 794 write errors, nothing stored.
          # mozilla-actions/sccache-action sets it unconditionally too.
          ACTIONS_CACHE_SERVICE_V2: "on"
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_GHA_VERSION: sccion-ci-1
          SCCACHE_SERVER_PORT: "4227"
          SCCACHE_IDLE_TIMEOUT: "0"
          # Why a write failed, which the counts alone cannot say.
          SCCACHE_LOG: warn
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache.log
        run: |
          set -euo pipefail
          version=v0.18.0
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=x86_64-unknown-linux-musl sum=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            macOS-ARM64) asset=aarch64-apple-darwin      sum=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;
            Windows-X64) asset=x86_64-pc-windows-msvc    sum=1a63c1be2beab3f04d27e4cc145443e092e02d3dd83a51030989829d7023091b ;;
            *) echo "::notice::no pinned sccache for $RUNNER_OS-$RUNNER_ARCH; compiling uncached"; exit 0 ;;
          esac
          name="sccache-$version-$asset"
          curl -sSfL -o sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/$version/$name.tar.gz"
          # Compared by hand: macOS has a BSD `sha256sum` whose `-c` will not
          # read GNU's format from stdin, and Windows may lack `shasum`.
          if command -v shasum >/dev/null; then got=$(shasum -a 256 sccache.tar.gz); else got=$(sha256sum sccache.tar.gz); fi
          got=${got%% *}
          [ "$got" = "$sum" ] || { echo "::error::sccache $version $asset: sha256 $got, expected $sum"; exit 1; }
          tar -xzf sccache.tar.gz
          exe=sccache; [ "$RUNNER_OS" = Windows ] && exe=sccache.exe
          dir="$RUNNER_TEMP/sccache"; mkdir -p "$dir"; mv "$name/$exe" "$dir/"; rm -rf "$name" sccache.tar.gz
          "$dir/$exe" --start-server
          echo "CI_SCCACHE=$dir/$exe" >> "$GITHUB_ENV"

      - name: Build tests
        run: cargo test --locked --lib --bins --tests --no-run ${{ matrix.extra_args }}
        env:
          CARGO_INCREMENTAL: "0"
          # Empty, and so uncached, wherever no sccache was installed.
          RUSTC_WRAPPER: ${{ env.CI_SCCACHE }}
          SCCACHE_SERVER_PORT: "4227"
          # A cache that falls over must cost speed, never the build.
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Copt-level=0 -Coverflow-checks=off"

      # sccion-mcp is a crate of its own, which `cargo test` above does not
      # reach: its tests stopped compiling once (0e63d6f8) and nothing noticed.
      # Its own features only, so not on the entries that pick the main
      # crate's; the same flags as above, so the sccion it links is not built
      # twice.
      - name: Build sccion-mcp tests
        if: ${{ !contains(matrix.extra_args, 'features') }}
        run: cargo test --locked -p sccion-mcp --no-run
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: ${{ env.CI_SCCACHE }}
          SCCACHE_SERVER_PORT: "4227"
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Copt-level=0 -Coverflow-checks=off"

      # A cache that stores nothing costs nothing visible -- the build passes,
      # only slower -- so failed writes are raised as a warning here, with the
      # server's own account of why, rather than left in the stats.
      - name: Stop the compiler cache
        if: ${{ always() && env.CI_SCCACHE != '' }}
        shell: bash
        env:
          SCCACHE_SERVER_PORT: "4227"
        run: |
          stats=$("$CI_SCCACHE" --stop-server) || true
          echo "$stats"
          errors=$(awk '/^Cache write errors/ {print $NF}' <<< "$stats")
          if [ "${errors:-0}" != 0 ]; then
            echo "::warning title=Compiler cache::$errors cache writes failed; later runs will not hit"
            tail -n 20 "$RUNNER_TEMP/sccache.log" 2>/dev/null || true
          fi

      # Built by the step above; cargo does not count the wrapper toward
      # freshness, so dropping it here recompiles nothing.
      - name: Execute tests
        run: cargo test --locked --lib --bins --tests ${{ matrix.extra_args }}
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: ""
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Copt-level=0 -Coverflow-checks=off"

      - name: Execute sccion-mcp tests
        if: ${{ !contains(matrix.extra_args, 'features') }}
        run: cargo test --locked -p sccion-mcp
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: ""
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Copt-level=0 -Coverflow-checks=off"

      - name: Upload failure
        if: failure()
        uses: ./.github/actions/artifact_failure
        with:
          name: test-${{ matrix.os }}-${{ matrix.rustc || 'stable' }}-${{ matrix.extra_desc }}

  # coverage:
      - name: Display coverage files
        if: ${{ ! matrix.no_coverage }}
        shell: bash
        run:
          grcov . -s . --binary-path $BINARY_DIR --output-type files $GRCOV_IGNORE_OPTION $GRCOV_EXCLUDE_OPTION | sort --unique

      - name: Generate coverage data (via `grcov`)
        if: ${{ ! matrix.no_coverage }}
        id: coverage
        shell: bash
        run: |
          mkdir -p "${COVERAGE_REPORT_DIR}"
          grcov . -s . --binary-path $BINARY_DIR --output-type lcov --output-path "${COVERAGE_REPORT_FILE}" --branch $GRCOV_IGNORE_OPTION $GRCOV_EXCLUDE_OPTION
          echo "report=${COVERAGE_REPORT_FILE}" >> $GITHUB_OUTPUT

      # After the tests, and not a verdict on them. An upload fails without a
      # CODECOV_TOKEN where Codecov requires one, and whenever Codecov is down;
      # either would turn a green test job red -- which is how a team learns to
      # stop reading the tick.
      - name: Upload coverage results (to Codecov.io)
        continue-on-error: true
        if: ${{ ! matrix.no_coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.coverage.outputs.report }}
          ## flags: IntegrationTests, UnitTests, ${{ steps.vars.outputs.CODECOV_FLAGS }}
          flags: ${{ steps.vars.outputs.CODECOV_FLAGS }}
          name: codecov-umbrella-${{ matrix.os }}-rust_${{ matrix.rustc || 'stable' }}-${{ matrix.extra_desc }}
          fail_ci_if_error: true
          # verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The toolchains that only need watching, not gating every push: beta and
  # nightly on Linux and Windows, and CUDA 11.8. Weekly, or when a manual run
  # asks for them. Same env and steps as `test`, by YAML alias rather than by
  # copy, so the two cannot drift apart.
  test_occasional:
    name: test ${{ matrix.os }} rust ${{ matrix.rustc || 'stable' }} ${{ (matrix.cuda == '' || inputs.cuda) && matrix.extra_desc || '' }}
    if: ${{ github.event_name == 'schedule' || inputs.toolchains || inputs.cuda }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rustc: beta
          - os: ubuntu-22.04
            rustc: nightly
            allow_failure: true
            extra_args: --features=unstable
          - os: ubuntu-22.04
            cuda: "11.8"
            extra_desc: cuda11.8
          - os: windows-2022
            cuda: "12.8"
            rustc: nightly
            allow_failure: true
            extra_args: --features=unstable
            notest_cuda_compilers: clang++
            extra_desc: cuda12.8
          - os: windows-2022
            cuda: "12.8"
            rustc: beta
            notest_cuda_compilers: clang++
            extra_desc: cuda12.8
            no_coverage: true
    env: *test-env
    steps: *test-steps

  # Release binaries, with LTO, for every target: half of what a run used to
  # cost, for artifacts only a tag's `release` job reads. Clippy on all three
  # OSes and the test jobs already compile the same code on every push.
  build:
    name: build ${{ matrix.binary || 'sccion' }} ${{ matrix.target }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.build }}
    runs-on: ${{ matrix.os }}
    container: ${{ fromJson(matrix.container || '{"image":null}') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            container: '{"image": "messense/rust-musl-cross:x86_64-musl"}'
          # Commented out rather than deleted: these build but nothing here
          # runs on them, and each is a cross-compile in its own container on
          # every push. Uncomment the entry to bring one back -- the release
          # matrix is the only thing that decides which targets ship.
#          - os: ubuntu-22.04
#            target: s390x-unknown-linux-musl
#            container: '{"image": "messense/rust-musl-cross:s390x-musl"}'
#            lto: "false"
#          - os: ubuntu-22.04
#            target: s390x-unknown-linux-gnu
#          - os: ubuntu-22.04
#            target: riscv64gc-unknown-linux-musl
#            container: '{"image": "messense/rust-musl-cross:riscv64gc-musl"}'
#            rustflags: -Ctarget-feature=+crt-static
#          - os: ubuntu-22.04
#            target: loongarch64-unknown-linux-musl
#            container: '{"image": "messense/rust-musl-cross:loongarch64-musl"}'
#            rustflags: -Ctarget-feature=+crt-static
          - os: ubuntu-22.04
            binary: sccion-dist
            extra_args: --no-default-features --features="dist-server"
            target: x86_64-unknown-linux-musl
            container: '{"image": "messense/rust-musl-cross:x86_64-musl"}'
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            container: '{"image": "messense/rust-musl-cross:aarch64-musl"}'
          - os: ubuntu-22.04
            binary: sccion-dist
            extra_args: --no-default-features --features="dist-server"
            target: aarch64-unknown-linux-musl
            container: '{"image": "messense/rust-musl-cross:aarch64-musl"}'
          - os: macos-14
            target: aarch64-apple-darwin
            macosx_deployment_target: 11.0
          # Cross-compiled from Apple Silicon rather than built on the Intel
          # runner, which cost ten times a Linux minute and is being retired.
          - os: macos-14
            target: x86_64-apple-darwin
            macosx_deployment_target: 11.0
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ matrix.target == 'aarch64-apple-darwin' && 'beta' || 'stable' }}
          target: ${{ matrix.target }}
        if: ${{ !matrix.container }}

      - name: Install s390x cross-compilation toolchain
        if: ${{ matrix.target == 's390x-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.s390x-unknown-linux-gnu]
          linker = "s390x-linux-gnu-gcc"
          EOF

      - name: Install rust-src for s390x-musl
        if: ${{ matrix.target == 's390x-unknown-linux-musl' }}
        run: |
          # Remove corrupted nightly toolchain if it exists
          rustup toolchain uninstall nightly || true
          # Clean up any leftover files
          rm -rf ~/.rustup/toolchains/nightly-* || true
          # Install fresh nightly with minimal profile
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      - name: Build (s390x-musl with build-std)
        if: ${{ matrix.target == 's390x-unknown-linux-musl' }}
        run: cargo +nightly build --locked --release --bin ${{ matrix.binary || 'sccion' }} --target ${{ matrix.target }} ${{ matrix.extra_args }} -Zbuild-std
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
          SDKROOT: ${{ matrix.sdkroot }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'true' }}

      - name: Build
        if: ${{ matrix.target != 's390x-unknown-linux-musl' }}
        run: cargo build --locked --release --bin ${{ matrix.binary || 'sccion' }} --target ${{ matrix.target }} ${{ matrix.extra_args }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
          SDKROOT: ${{ matrix.sdkroot }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'true' }}

      # sccion-mcp ships in the same archive as sccion: it is the agent-facing
      # half of one install, and without it a release left `cargo install` from
      # a checkout as the only way to get it. sccion-dist entries skip it.
      - name: Build sccion-mcp
        if: ${{ !matrix.binary && matrix.target != 's390x-unknown-linux-musl' }}
        run: cargo build --locked --release -p sccion-mcp --bin sccion-mcp --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
          DEVELOPER_DIR: ${{ matrix.developer_dir }}
          SDKROOT: ${{ matrix.sdkroot }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'true' }}

      # Workaround for the lack of substring() function in github actions expressions.
      - name: Id
        id: id
        shell: bash
        run: echo "id=${ID#refs/tags/}" >> $GITHUB_OUTPUT
        env:
          ID: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || github.sha }}

      # One directory per artifact holding every binary this entry built; the
      # release job archives that directory as it is.
      - name: Stage binaries
        shell: bash
        run: |
          exe='${{ endsWith(matrix.target, '-msvc') && '.exe' || '' }}'
          bin='target/${{ matrix.target }}/release'
          mkdir -p stage
          cp "$bin/${{ matrix.binary || 'sccion' }}$exe" stage/
          if [ -z '${{ matrix.binary }}' ]; then cp "$bin/sccion-mcp$exe" stage/; fi
          ls -l stage

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary || 'sccion' }}-${{ steps.id.outputs.id }}-${{ matrix.target }}
          path: stage/
          if-no-files-found: error


  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ build, lint, test ]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    # The repository's default token is read-only; creating the release and
    # uploading its assets is the one write any workflow here makes.
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check versions
        run: |
          tag_name=${GITHUB_REF#refs/tags/}
          v=$(grep -m 1 "^version" Cargo.toml|sed -e "s|version = \"\(.*\)\"|\1|")
          # Exactly `v` and the version. This was an unanchored grep, so for a
          # Cargo.toml saying 0.17.0 it passed v10.17.0, v0.17.0-rc.1 and even
          # v0.1730 (the dots are wildcards) -- and the action installs the
          # release named by its own tag's Cargo.toml.
          if [ "$tag_name" != "v$v" ]; then
             echo "Mismatch of the version:"
             echo "Cargo.toml says $v, so the tag must be v$v, not $tag_name"
             exit 2
          fi

      - name: Get artifacts
        uses: actions/download-artifact@v8

      - name: Create release assets
        run: |
          for d in sccion-*; do
            chmod +x "$d/sccion"*
            cp README.md LICENSE "$d/"
            tar -zcvf "$d.tar.gz" "$d"
            echo -n "$(shasum -ba 256 "$d.tar.gz" | cut -d " " -f 1)" > "$d.tar.gz.sha256"
            if [[ $d =~ sccion-.*-pc-windows-.* ]]; then
              zip -r "$d.zip" "$d"
              echo -n "$(shasum -ba 256 "$d.zip" | cut -d " " -f 1)" > "$d.zip.sha256"
            fi
          done

      # Published, not a draft: the action installs releases through the API
      # with the consuming workflow's own `github.token`, and that token sees
      # no drafts. `gh` rather than `hub`, which is archived and had to be
      # installed from apt; `gh` is on the runner.
      - name: Create release
        run: |
          tag_name=${GITHUB_REF#refs/tags/}
          shopt -s nullglob
          gh release create "$tag_name" --verify-tag --title "$tag_name" \
            --notes "A snapshot of sccion's \`main\` at $tag_name -- experimental and unsupported; see the [fork status](https://github.com/${{ github.repository }}#fork-status-experimental--unsupported). Each archive has its \`.sha256\` beside it." \
            sccion-*.tar.gz* sccion-*.zip*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
