# SPDX-License-Identifier: Apache-2.0

name: Benchmarks

# spell-checker:ignore codspeed dtolnay Swatinem

on:
  # Prose-only commits are skipped, as in `ci.yml`: nothing here reads these paths.
  pull_request:
    paths-ignore: &prose
      - 'context/**'
      - 'docs/**'
      - '**.md'
  # `main` only, for two reasons. CodSpeed compares a pull request against the
  # base branch's last run, so pushes here are the baseline and cannot simply be
  # dropped. And the previous pattern was `'*'`, which does not match a branch
  # name containing a slash -- so `ci/enable-actions` never benchmarked while
  # `some-branch` would have. Naming the one branch that matters removes both
  # the cost and the surprise.
  push:
    branches:
      - main
    paths-ignore: *prose

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  benchmarks:
    name: Run ${{ matrix.mode }} benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        mode:
          - simulation
          - memory
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed
        shell: bash
        run: cargo install cargo-codspeed --locked

      - name: Build benchmarks
        shell: bash
        run: cargo codspeed build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        env:
          CODSPEED_LOG: debug
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run > /dev/null
          token: ${{ secrets.CODSPEED_TOKEN }}
