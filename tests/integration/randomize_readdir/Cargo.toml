[package]
edition = "2021"
name = "randomize_readdir"
version = "0.1.0"

# The shim is `#![cfg(target_os = "linux")]` -- an LD_PRELOAD over glibc's
# readdir64, see the crate docs -- so anywhere else the crate is empty and its
# dependencies would be built for nothing.
[target.'cfg(target_os = "linux")'.dependencies]
ctor = "0.2"
libc = "0.2.99"
log = "0.4"
rand = "0.10.2"
simplelog = "0.12"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true
