# Vendored from bincode 1.3.3. See README.md for why and what may be changed.
#
# The package is renamed so that nothing can confuse it with the crates.io
# crate, and so that `cargo tree` says where the code came from. The root
# manifest imports it as `bincode`, which is why no call site changed.
[package]
edition = "2015"                # as published; see README.md
name = "sccion-bincode"
publish = false
rust-version = "1.91.0"
version = "1.3.3"

authors = [
  "Ty Overby <ty@pre-alpha.com>",
  "Francesco Mazzoli <f@mazzo.li>",
  "David Tolnay <dtolnay@gmail.com>",
  "Zoey Riordan <zoey@dos.cafe>",
]
description = "bincode 1.3.3, vendored. A binary serialization strategy over serde."
license = "MIT"
repository = "https://github.com/servo/bincode"

[dependencies]
serde = "1.0.63"

[dev-dependencies]
serde_bytes = "0.11"
serde_derive = "1.0.27"

[features]
i128 = []

# Deliberately not `workspace = true`. This is vendored third-party code kept
# close to what was published, so that a diff against 1.3.3 shows only what we
# meant to change. Holding it to lints written for this project's own code would
# fill that diff with churn.
[lints.rust]
# Upstream ships the whole `byteorder` API and uses part of it, and has one impl
# that a later rustc learned to warn about. Allowed rather than edited: the point
# of vendoring is that a diff against 1.3.3 shows only deliberate changes, and a
# build that always prints warnings is a build where nobody reads them.
dead_code = "allow"
non_local_definitions = "allow"
# Upstream's own test suite, kept verbatim so it still means what it meant: a
# deprecated serde macro, a stale `macro_use`, two stray semicolons.
deprecated = "allow"
redundant_semicolons = "allow"
unused_imports = "allow"

# Same reasoning, for clippy. Upstream predates most of these lints, and one of
# them (`approx_constant`, on a test that round-trips 3.14159) is deny-by-default
# and would fail the build. Rewriting third-party code to satisfy lints it was
# never written against is exactly the churn vendoring is supposed to avoid.
[lints.clippy]
all = { level = "allow", priority = -1 }
