# Vendored from bincode 1.3.3, then migrated to edition 2024.
# See README.md for why, and for what diverges from the published crate.
#
# The package is renamed so that nothing can confuse it with the crates.io
# crate, and so that `cargo tree` says where the code came from. The root
# manifest imports it as `bincode`, which is why no call site changed.
[package]
edition = "2024"
name = "sccion-bincode"
publish = false
rust-version = "1.91.0"
version = "1.3.3"

authors = [
  "Ty Overby <ty@pre-alpha.com>",
  "Francesco Mazzoli <f@mazzo.li>",
  "David Tolnay <dtolnay@gmail.com>",
  "Zoey Riordan <zoey@dos.cafe>",
]
description = "bincode 1.3.3, vendored. A binary serialization strategy over serde."
license = "MIT"
repository = "https://github.com/servo/bincode"

[dependencies]
serde = "1.0.63"

[dev-dependencies]
serde_bytes = "0.11"
serde_derive = "1.0.27"

[features]
i128 = []

# Deliberately not `workspace = true`. These are upstream's warnings, not this
# project's code, and a build that always prints warnings is a build where nobody
# reads them. What guards this crate is not lint parity but its tests: upstream's
# 50, plus `util::bincode_format` and `protocol::wire_format`, which say the
# encoding has not moved.
[lints.rust]
# Upstream ships the whole `byteorder` API and uses part of it.
dead_code = "allow"
non_local_definitions = "allow"
# Upstream's own test suite: a deprecated serde macro and a stale `macro_use`.
deprecated = "allow"
unused_imports = "allow"

# One of clippy's (`approx_constant`, on a test that round-trips 3.14159) is
# deny-by-default and would fail the build outright.
[lints.clippy]
all = { level = "allow", priority = -1 }
