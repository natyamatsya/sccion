[package]
edition = "2024"
name = "sccion-mcp"
rust-version = "1.91.0"
version = "0.1.3"

description = "Model Context Protocol adapter for sccion: a read-only query surface over a local sccion daemon."
license = "Apache-2.0"
repository = "https://github.com/natyamatsya/sccion/"

[[bin]]
name = "sccion-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# Only `sccion::api` is used. The adapter never touches the cache, the wire
# format, or the compile path -- that is the whole point of the seam.
env_logger = "0.11"
sccion = { path = "../.." }
# The protocol itself, so that this crate implements none of it. The SDK tracks
# MCP's quarterly revisions and negotiates between them per connection, which a
# hand-written envelope here could not: it spoke one revision, and every client
# on an older one saw a server that would not answer.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
# Only the current-thread runtime: this process answers one stdio connection and
# does nothing else.
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[lints]
workspace = true
