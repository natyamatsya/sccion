[package]
edition = "2024"
name = "sccion-mcp"
rust-version = "1.91.0"
version = "0.17.0"

description = "Model Context Protocol adapter for sccion: a read-only query surface over a local sccion daemon."
license = "Apache-2.0"
repository = "https://github.com/natyamatsya/sccion/"

[[bin]]
name = "sccion-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# Only `sccion::api` is used. The adapter never touches the cache, the wire
# format, or the compile path -- that is the whole point of the seam.
sccion = { path = "../.." }
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = ">=1.0, <1.0.147"

[lints]
workspace = true
