[package]
# Should match .rustfmt.toml
edition = "2024"
name = "sccion"
rust-version = "1.91.0"
version = "0.17.0"

categories = ["command-line-utilities", "development-tools::build-utils"]
description = "sccion is a compiler cache, grafted from Mozilla's sccache. It is used as a compiler wrapper and avoids compilation when possible, storing results in local or remote storage."
keywords = ["ccache", "sccache"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/natyamatsya/sccion/"

[package.metadata.binstall]
bin-dir = "sccion-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/sccion-v{ version }-{ target }{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "sccion"

[[bin]]
name = "sccion-dist"
required-features = ["dist-server"]

[profile.test]
debug = false # save disk space

[profile.release]
codegen-units = 1
lto = true
strip = true

# Release, but resolvable in a profiler.
#
# Inherits release rather than standing alone on purpose: `lto` and
# `codegen-units = 1` change inlining enough that a profile taken without them
# describes a binary nobody ships. The only differences are that symbols
# survive, so a sampled stack names functions instead of addresses.
[profile.profiling]
debug = 1
inherits = "release"
strip = false

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
ar = "0.9"
async-trait = "0.1"
# The dist server's HTTP layer: routing and extraction only. Serving is
# sccion's own loop over hyper, which is where TLS goes in, so none of axum's
# serving, JSON or form features are needed.
axum = { version = "0.8.9", optional = true, default-features = false }
backon = { version = "1", default-features = false, features = [
  "std-blocking-sleep",
] }
base64 = "0.23"
# Vendored: see crates/bincode. bincode is unmaintained -- its last release is a
# `compile_error!` -- and this encoding is the preprocessor cache on disk and
# every client/daemon message. Copying 3 770 frozen lines answers that without
# a format change; every alternative answered it with a migration.
bincode = { package = "sccion-bincode", path = "crates/bincode" }
blake3 = "1"
byteorder = "1.5"
bytes = "1"
chrono = "0.4"
clap = { version = "4.5.13", features = ["derive", "env", "wrap_help"] }
# Kept only to find where sccache put things, so a machine that has been
# building for years is not asked to warm a cache from nothing. New paths come
# from `etcetera`.
directories = "6.0"
encoding_rs = "0.8"
env_logger = "0.11"
# Where a command-line tool keeps its things: XDG on Linux *and* macOS, which
# is the convention a cache you `du` and delete from a terminal belongs to.
# `directories` is platform-native everywhere, and its macOS answer --
# ~/Library/Caches -- is the right one for a GUI application and a surprising
# one here.
etcetera = "0.11"
filetime = "0.2"
flate2 = { version = "1.0", optional = true, default-features = false, features = [
  "rust_backend",
] }
fs-err = "3"
futures = "0.3"
http = "1.0"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.3", optional = true, features = [
  "tokio",
  "server",
] }
itertools = "0.15"
jobserver = "0.1"
jwt = { package = "jsonwebtoken", version = "9", optional = true }
libc = "0.2.153"
linked-hash-map = "0.5"
log = "0.4"
memchr = "2"
memmap2 = "0.9.4"
mime = { version = "0.3", optional = true }
number_prefix = "0.4"
object = "0.40"
opendal = { version = "0.59.4", optional = true, default-features = false, features = [
  "layers-logging",
] }
# opendal 0.58 made the HTTP transport pluggable and moved the reqwest one
# out of the facade, so setting a user agent means naming this crate.
opendal-http-transport-reqwest = { version = "0.59.4", optional = true }
rand = "0.10.2"
# The dist server's self-signed certificate. RSA keys need aws-lc-rs, which
# rustls already brings in.
rcgen = { version = "0.14.10", optional = true, default-features = false, features = [
  "aws_lc_rs",
  "crypto",
  "pem",
] }
regex = "1.10.3"
reqwest = { version = "0.13.4", features = [
  "json",
  "blocking",
  "stream",
  # `rustls` pulls rustls-platform-verifier, which is the OS trust store --
  # what the old `rustls-tls-native-roots` asked for by name.
  "rustls",
  "hickory-dns",
], optional = true }
# The dist server's TLS: the rustls clients and the scheduler already verify
# with, on the aws-lc-rs provider already in the build. Named only to build a
# `ServerConfig` and read the PEM certificate.
rustls = { version = "0.23.43", optional = true, default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
# `Vec<u8>` through serde is a sequence of `u8`, which bincode encodes one
# element at a time. The bytes on the wire are identical either way; the
# difference is a per-byte loop against a memcpy, on payloads that are whole
# cache objects.
serde_bytes = "0.11"
serde_json = "1.0.151"
sha2 = { version = "0.11.0", optional = true }
shlex = "2.0.1"
strip-ansi-escapes = "0.2"
tar = "0.4.40"
tempfile = "3"
# The certificate's validity window, which rcgen takes as a `time` date.
time = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "time",
  "net",
  "process",
  "macros",
] }
# Accepting TLS connections for the dist server.
tokio-rustls = { version = "0.26.4", optional = true, default-features = false }
tokio-serde = "0.9"
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
toml = "1.1"
# `ServiceExt::oneshot`, to hand each request on a connection to the dist
# server's router. axum depends on it already.
tower = { version = "0.5.3", optional = true, default-features = false, features = [
  "util",
] }
tower-service = "0.3"
typed-path = "0.12.0"
url = { version = "2", optional = true }
uuid = { version = "1.9", features = ["v4"] }
walkdir = "2"
which = "8"
zip = { version = "8", default-features = false }
zstd = "0.13"

# dist-server only
nix = { version = "0.30.0", optional = true, features = [
  "mount",
  "user",
  "sched",
  "signal",
  "process",
] }
syslog = { version = "7", optional = true }
version-compare = { version = "0.1.1", optional = true }

[dev-dependencies]
assert_cmd = "2.0.13"
cc = "1.0"
chrono = "0.4.42"
divan = { package = "codspeed-divan-compat", version = "5" }
filetime = "0.2"
predicates = "3.1.4"
# Verifying the dist server's certificate the way its clients do, through
# rustls's own verifier.
rustls-pki-types = "1.15"
rustls-webpki = { version = "0.103", default-features = false, features = [
  "std",
  "aws-lc-rs",
] }
serial_test = "3.1"
temp-env = "0.3.6"
test-case = "3.3.1"
thirtyfour = "0.37"

# Reading PDBs is how the debug-information tests confirm that a cache hit from
# another checkout still points a debugger at the right sources -- checked by
# resolving the recorded paths and comparing source checksums, rather than by
# someone stepping through a debugger by hand.
[target.'cfg(windows)'.dev-dependencies]
md-5 = "0.11"
pdb = "0.8"
sha1 = "0.11"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
daemonix = "0.1"

# Where the OS trust store can be empty, and reqwest 0.13 refuses to build a
# client over an empty one; see `util::bundled_root_certs`. Both already in the
# lock: `rustls-native-certs` is what rustls-platform-verifier reads the store
# with -- the same version, so the emptiness check is the verifier's own -- and
# `webpki-root-certs` is its fallback on wasm.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
rustls-native-certs = "0.8.4"
webpki-root-certs = "1.0.9"

# The parallel gzip behind `into_compressed_tar`, which packages a toolchain for
# a distributed compile -- only where that packaging exists, the targets
# `dist::pkg::toolchain_imp` is built for. Everywhere else it was compiled and
# never called.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
gzp = { version = "2", optional = true, default-features = false, features = [
  "deflate_rust",
] }

[target.'cfg(not(target_os = "freebsd"))'.dependencies.libmount]
optional = true
version = "0.1.15"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Security",
  # ReFS block cloning: DeviceIoControl plus the FSCTL_* codes and structs.
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # Named pipe transport: SID lookup for the pipe name, and WaitNamedPipeW.
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
]
version = "0.61"

[features]
all = [
  "dist-client",
  "redis",
  "s3",
  "memcached",
  "gcs",
  "azure",
  "gha",
  "webdav",
  "oss",
  "cos",
]
azure = ["opendal/services-azblob", "reqwest", "opendal-http-transport-reqwest"]
cos = ["opendal/services-cos", "reqwest", "opendal-http-transport-reqwest"]
default = ["all"]
gcs = [
  "opendal/services-gcs",
  "url",
  "reqwest",
  "opendal-http-transport-reqwest",
]
gha = ["opendal/services-ghac", "reqwest", "opendal-http-transport-reqwest"]
memcached = ["opendal/services-memcached"]
native-zlib = []
oss = ["opendal/services-oss", "reqwest", "opendal-http-transport-reqwest"]
redis = ["url", "opendal/services-redis"]
s3 = ["opendal/services-s3", "reqwest", "opendal-http-transport-reqwest"]
webdav = [
  "opendal/services-webdav",
  "reqwest",
  "opendal-http-transport-reqwest",
]
# Enable features that require unstable features of Nightly Rust.
unstable = []
# Enables distributed support in the sccache client
dist-client = [
  "flate2",
  "gzp",
  "hyper",
  "http-body-util",
  "hyper-util",
  "mime",
  "reqwest",
  "url",
  "sha2",
]
# Enables the sccache-dist binary: the scheduler and build server on axum,
# hyper 1 and tokio, with TLS through rustls.
dist-server = [
  "axum",
  "jwt",
  "flate2",
  "hyper",
  "hyper-util",
  "libmount",
  "mime",
  "nix",
  "rcgen",
  "reqwest",
  "rustls",
  "sha2",
  "syslog",
  "time",
  "tokio-rustls",
  "tokio-util/io-util",
  "tower",
  "version-compare",
]
# Enables dist tests with external requirements
dist-tests = ["dist-client", "dist-server"]

[workspace]
exclude = ["tests/test-crate"]
members = [
  "crates/bincode",
  "crates/sccion-mcp",
  "scripts/bench",
  "tests/integration/randomize_readdir",
]

[[bench]]
harness = false
name = "sccion_bench"
test = false

[lints]
workspace = true

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
cloned_ref_to_slice_refs = "warn"
explicit_into_iter_loop = "warn"
# `from_iter_instead_of_collect` was here. Clippy removed it -- "lint has proved
# problematic" -- and a removed lint is not silent: it warns on every build,
# which `-D warnings` in CI turns into a failure.
implicit_clone = "warn"
manual_string_new = "warn"
ptr_as_ptr = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
