[package]
# Should match .rustfmt.toml
edition = "2024"
name = "sccion"
rust-version = "1.91.0"
version = "0.17.0"

categories = ["command-line-utilities", "development-tools::build-utils"]
description = "sccion is a compiler cache, grafted from Mozilla's sccache. It is used as a compiler wrapper and avoids compilation when possible, storing results in local or remote storage."
keywords = ["ccache", "sccache"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/natyamatsya/sccion/"

[package.metadata.binstall]
bin-dir = "sccion-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/sccion-v{ version }-{ target }{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "sccion"

[[bin]]
name = "sccion-dist"
required-features = ["dist-server"]

[profile.test]
debug = false # save disk space

[profile.release]
codegen-units = 1
lto = true
strip = true

# Release, but resolvable in a profiler.
#
# Inherits release rather than standing alone on purpose: `lto` and
# `codegen-units = 1` change inlining enough that a profile taken without them
# describes a binary nobody ships. The only differences are that symbols
# survive, so a sampled stack names functions instead of addresses.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
ar = "0.9"
async-trait = "0.1"
backon = { version = "1", default-features = false, features = [
  "std-blocking-sleep",
] }
base64 = "0.21"
bincode = "1"
blake3 = "1"
byteorder = "1.5"
bytes = "1"
chrono = "0.4"
clap = { version = "4.5.13", features = ["derive", "env", "wrap_help"] }
directories = "6.0"
encoding_rs = "0.8"
env_logger = "0.11"
filetime = "0.2"
flate2 = { version = "1.0", optional = true, default-features = false, features = [
  "rust_backend",
] }
fs-err = "3"
futures = "0.3"
gzp = { version = "2", default-features = false, features = ["deflate_rust"] }
http = "1.0"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.3", optional = true, features = [
  "tokio",
  "server",
] }
itertools = "0.14"
jobserver = "0.1"
jwt = { package = "jsonwebtoken", version = "9", optional = true }
libc = "0.2.153"
linked-hash-map = "0.5"
log = "0.4"
memchr = "2"
memmap2 = "0.9.4"
mime = "0.3"
number_prefix = "0.4"
object = "0.37"
opendal = { version = "0.55.0", optional = true, default-features = false }
openssl = { version = "0.10.75", optional = true }
rand = "0.8.4"
regex = "1.10.3"
reqsign = { version = "0.18.0", optional = true }
reqwest = { version = "0.12", features = [
  "json",
  "blocking",
  "stream",
  "rustls-tls",
  "rustls-tls-native-roots",
  "trust-dns",
], optional = true }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = ">=1.0, <1.0.147" # zmij (used in 1.0.147+) requires Rust 1.84+
sha2 = { version = "0.10.8", optional = true }
shlex = "1.3.0"
strip-ansi-escapes = "0.2"
tar = "0.4.40"
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "time",
  "net",
  "process",
  "macros",
] }
tokio-serde = "0.9"
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
toml = "0.9"
tower-service = "0.3"
typed-path = "0.12.0"
url = { version = "2", optional = true }
uuid = { version = "1.9", features = ["v4"] }
walkdir = "2"
# by default which pulls in an outdated failure version
which = { version = "6", default-features = false }
zip = { version = "0.6", default-features = false }
zstd = "0.13"

# dist-server only
nix = { version = "0.30.0", optional = true, features = [
  "mount",
  "user",
  "sched",
  "signal",
  "process",
] }
rouille = { version = "3.6", optional = true, default-features = false, features = [
  "ssl",
] }
syslog = { version = "7", optional = true }
version-compare = { version = "0.1.1", optional = true }

[dev-dependencies]
assert_cmd = "2.0.13"
cc = "1.0"
chrono = "0.4.42"
divan = { package = "codspeed-divan-compat", version = "4" }
filetime = "0.2"
predicates = "=3.1.0"
serial_test = "3.1"
temp-env = "0.3.6"
test-case = "3.3.1"
thirtyfour = "0.36"

# Reading PDBs is how the debug-information tests confirm that a cache hit from
# another checkout still points a debugger at the right sources -- checked by
# resolving the recorded paths and comparing source checksums, rather than by
# someone stepping through a debugger by hand.
[target.'cfg(windows)'.dev-dependencies]
md-5 = "0.10"
pdb = "0.8"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
daemonix = "0.1"

[target.'cfg(not(target_os = "freebsd"))'.dependencies.libmount]
optional = true
version = "0.1.15"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Security",
  # ReFS block cloning: DeviceIoControl plus the FSCTL_* codes and structs.
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # Named pipe transport: SID lookup for the pipe name, and WaitNamedPipeW.
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
]
version = "0.52"

[features]
all = [
  "dist-client",
  "redis",
  "s3",
  "memcached",
  "gcs",
  "azure",
  "gha",
  "webdav",
  "oss",
  "cos",
]
azure = ["opendal/services-azblob", "reqsign", "reqwest"]
cos = ["opendal/services-cos", "reqsign", "reqwest"]
default = ["all"]
gcs = ["opendal/services-gcs", "reqsign", "url", "reqwest"]
gha = ["opendal/services-ghac", "reqwest"]
memcached = ["opendal/services-memcached"]
native-zlib = []
oss = ["opendal/services-oss", "reqsign", "reqwest"]
redis = ["url", "opendal/services-redis"]
s3 = ["opendal/services-s3", "reqsign", "reqwest"]
webdav = ["opendal/services-webdav", "reqwest"]
# Enable features that will build a vendored version of openssl and
# statically linked with it, instead of linking against the system-wide openssl
# dynamically or statically.
vendored-openssl = ["openssl?/vendored", "reqwest?/native-tls-vendored"]
# Enable features that require unstable features of Nightly Rust.
unstable = []
# Enables distributed support in the sccache client
dist-client = [
  "flate2",
  "hyper",
  "http-body-util",
  "hyper-util",
  "reqwest",
  "url",
  "sha2",
]
# Enables the sccache-dist binary
dist-server = [
  "jwt",
  "flate2",
  "libmount",
  "nix",
  "openssl",
  "reqwest",
  "rouille",
  "syslog",
  "version-compare",
]
# Enables dist tests with external requirements
dist-tests = ["dist-client", "dist-server"]

[workspace]
exclude = ["tests/test-crate"]
members = [
  "crates/sccion-mcp",
  "scripts/bench",
  "tests/integration/randomize_readdir",
]

[[bench]]
harness = false
name = "sccion_bench"
test = false

[lints]
workspace = true

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
cloned_ref_to_slice_refs = "warn"
explicit_into_iter_loop = "warn"
from_iter_instead_of_collect = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
ptr_as_ptr = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
